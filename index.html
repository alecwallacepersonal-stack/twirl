<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TWIRL</title>
<meta name="description" content="TWIRL — official site. Join the mailing list.">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inconsolata:wght@400;500;600;700&display=swap');

  :root{
    --ink: #f4ece7;
    --ink-dim: #cbb9c9;
    --bg-1: #170510;
    --bg-2: #3a0e24;
    --bg-3: #200a1e;
    --accent-violet: #6a5cd6;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin: 0;
    padding: 0;
    height: 100%;
  }

  body{
    min-height: 100vh;
    background:
      radial-gradient(ellipse 120% 80% at 50% 0%, var(--bg-2) 0%, var(--bg-3) 45%, var(--bg-1) 100%);
    background-attachment: fixed;
    color: var(--ink);
    font-family: 'Inconsolata', ui-monospace, 'SF Mono', Menlo, monospace;
    overflow-x: hidden;
    padding: env(safe-area-inset-top, 0px) 24px env(safe-area-inset-bottom, 0px);
  }

  .stage{
    width: 100%;
    max-width: 1300px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 48px 0 64px;
  }

  .gif-wrap{
    width: 100%;
    max-width: 1300px;
    line-height: 0;
    opacity: 0;
    transform: scale(0.97);
    transition: opacity 0.9s ease, transform 0.9s ease;
  }

  .gif-wrap.shown{
    opacity: 1;
    transform: scale(1);
  }

  .gif-wrap img{
    width: 100%;
    height: auto;
    display: block;
    border-radius: 6px;
    filter: drop-shadow(0 18px 40px rgba(0,0,0,0.55));
  }

  .tagline{
    margin-top: 28px;
    font-weight: 400;
    font-size: clamp(1rem, 2.4vw, 1.3rem);
    color: var(--ink-dim);
    max-width: 34ch;
    opacity: 0;
    transform: translateY(6px);
    transition: opacity 0.7s ease 0.15s, transform 0.7s ease 0.15s;
  }

  .tagline.shown{
    opacity: 1;
    transform: translateY(0);
  }

  .signup{
    margin-top: 36px;
    width: 100%;
    max-width: 640px;
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 0.7s ease 0.3s, transform 0.7s ease 0.3s;
  }

  .signup.shown{
    opacity: 1;
    transform: translateY(0);
  }

  .signup iframe{
    width: 100%;
    height: 900px;
    max-height: 80vh;
    border: none;
    border-radius: 10px;
    background: #ffffff;
    filter: invert(93%) hue-rotate(180deg) contrast(92%);
  }

  .loader{
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    background: var(--bg-1);
    z-index: 10;
    transition: opacity 0.6s ease;
  }

  .loader.hidden{
    opacity: 0;
    pointer-events: none;
  }

  .loader-mark{
    width: 46px;
    height: 46px;
    border-radius: 50%;
    border: 3px solid rgba(244, 236, 231, 0.18);
    border-top-color: var(--accent-amber);
    animation: spin 0.9s linear infinite;
  }

  .loader-text{
    font-size: 1rem;
    color: var(--ink-dim);
    letter-spacing: 0.01em;
  }

  @keyframes spin{
    to{ transform: rotate(360deg); }
  }

  @media (prefers-reduced-motion: reduce){
    .gif-wrap, .tagline, .signup, .loader{
      transition: none !important;
      transform: none !important;
    }
    .loader-mark{
      animation: none;
    }
  }
</style>
</head>
<body>

  <div class="loader" id="loader">
    <div class="loader-mark" aria-hidden="true"></div>
    <p class="loader-text">Loading&hellip;</p>
  </div>

  <main class="stage">
    <div class="gif-wrap" id="gifWrap">
      <img id="bandGif" src="twirl.gif" alt="TWIRL — animated hand-painted band name over a swirling purple background" width="750" height="278">
    </div>

    <p class="tagline" id="tagline">Join the mailing list to hear about upcoming shows and releases</p>

    <div class="signup" id="signup">
      <iframe src="https://docs.google.com/forms/d/1OF_5MHYru0NukRJ2Ze5HTgFAnRYaXvWXGyi58AHZD-Q/viewform?embedded=true" title="TWIRL mailing list sign-up form">Loading form…</iframe>
    </div>
  </main>

  <script>
    var loader = document.getElementById('loader');
    var gif = document.getElementById('bandGif');
    var gifWrap = document.getElementById('gifWrap');
    var tagline = document.getElementById('tagline');
    var signup = document.getElementById('signup');

    function revealRest(){
      loader.classList.add('hidden');
      gifWrap.classList.add('shown');
      // Small stagger so the gif visually lands first, then everything else follows.
      setTimeout(function(){
        tagline.classList.add('shown');
        signup.classList.add('shown');
      }, 250);
    }

    // The gif is a full-quality, uncompressed file and can take a while to
    // download on slower connections. We keep the loading screen up the
    // whole time so nothing else appears until it's actually ready.
    if (gif.complete && gif.naturalWidth > 0) {
      revealRest();
    } else {
      gif.addEventListener('load', revealRest);
      // If the gif fails outright, don't leave people stuck on the loader forever.
      gif.addEventListener('error', revealRest);
    }
  </script>

</body>
</html>
